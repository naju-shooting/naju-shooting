<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탄약 개수 실시간 파악 테스트</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px #0000001a; }
        video { display: none; } 
        canvas { width: 100%; max-width: 500px; border-radius: 8px; background: #000; }
        .result-box { margin-top: 15px; font-size: 24px; font-weight: bold; color: #d32f2f; }
        .status { color: #666; font-size: 14px; margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 5px; word-break: break-all; }
    </style>
    
    <!-- 💡 변경점: 속도가 느린 공식 사이트 대신, 전 세계 고속 서버망(cdnjs)의 주소로 교체했습니다. -->
    <!-- 오류 발생 시 추적할 수 있도록 onerror 이벤트도 추가했습니다. -->
    <script async 
            src="https://cloudflare.com" 
            onload="onOpenCvReady();" 
            onerror="onOpenCvError();" 
            type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>실탄 개수 실시간 카운터</h2>
    <div id="status" class="status">OpenCV 고속 라이브러리를 로딩 중입니다... (3~5초 소요)</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvasOutput"></canvas>
    
    <div class="result-box">
        검출된 실탄: <span id="count">0</span>발
    </div>
</div>

<script>
let video = document.getElementById('video');
let canvasOutput = document.getElementById('canvasOutput');
let ctx = canvasOutput.getContext('2d', { willReadFrequently: true });
let isOpenCvReady = false;

function logStatus(msg) {
    document.getElementById('status').innerText = msg;
    console.log(msg);
}

// 라이브러리 로드 실패 시 예외 처리
function onOpenCvError() {
    logStatus("❌ 에러: OpenCV 라이브러리 파일을 다운로드하는 데 실패했습니다. 네트워크 연결을 확인하거나 잠시 후 다시 시도해 주세요.");
}

// 1. OpenCV 로드 완료 확인
function onOpenCvReady() {
    logStatus("OpenCV 로드 완료! 카메라 연결을 시작합니다.");
    isOpenCvReady = true;
    startCamera();
}

// 2. 카메라 작동 기능
function startCamera() {
    const constraints = {
        video: { facingMode: { ideal: "environment" } },
        audio: false
    };

    logStatus("카메라 권한 요청 중...");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        logStatus("❌ 에러: 이 브라우저/주소는 카메라를 지원하지 않습니다. 반드시 HTTPS 주소로 접속해야 합니다.");
        return;
    }

    navigator.mediaDevices.getUserMedia(constraints)
        .then(handleSuccess)
        .catch(function(err) {
            logStatus("❌ 카메라 켜기 실패: " + err.name + " (" + err.message + ")\n주소창 맨 앞이 https:// 가 맞는지 확인해 주세요.");
        });
}

function handleSuccess(stream) {
    video.srcObject = stream;
    video.setAttribute('playsinline', true);
    video.setAttribute('muted', true);
    video.play();
    
    logStatus("✅ 카메라 연결 성공! 탄약상자를 비춰주세요.");
    
    video.addEventListener('canplay', () => {
        canvasOutput.width = video.videoWidth;
        canvasOutput.height = video.videoHeight;
        setTimeout(processVideo, 30);
    });
}

// 3. 영상 실시간 분석
function processVideo() {
    if (!isOpenCvReady || video.paused || video.ended) {
        return;
    }

    try {
        let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
        ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
        let imgData = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);
        src.data.set(imgData.data);

        let gray = new cv.Mat();
        let circles = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(9, 9), 2, 2);

        cv.HoughCircles(
            gray, circles, cv.HOUGH_GRADIENT, 1, 25, 50, 18, 8, 25 
        );

        let count = 0;
        if (circles.cols > 0) {
            count = circles.cols;
            for (let i = 0; i < circles.cols; ++i) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];
                
                let center = new cv.Point(x, y);
                cv.circle(src, center, radius, [0, 255, 0, 255], 2);
                cv.circle(src, center, 2, [0, 0, 255, 255], -1);
            }
        }

        document.getElementById('count').innerText = count;
        cv.imshow('canvasOutput', src);

        src.delete();
        gray.delete();
        circles.delete();

    } catch (err) {
        console.error(err);
    }

    requestAnimationFrame(processVideo);
}
</script>

</body>
</html>
