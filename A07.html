<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>.22LR 탄약 자동 촬영 카운터</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 15px; -webkit-user-select: none; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h2 { margin: 5px 0 15px 0; color: #1a1a1a; font-size: 20px; }
        
        .start-btn { 
            background: #00e676; color: #000; border: none; padding: 20px 30px; 
            font-size: 22px; font-weight: bold; border-radius: 35px; cursor: pointer; 
            width: 100%; box-shadow: 0 6px 20px rgba(0,230,118,0.4); margin-bottom: 15px; 
            -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
            display: block;
        }
        
        #video { display: none; }
        #canvasOutput { width: 100%; height: auto; background: #222; border-radius: 12px; display: none; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
        
        /* 촬영 상태 알림 레이블 */
        .timer-badge { display: inline-block; padding: 6px 12px; background: #ff9100; color: white; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: none; }
        
        /* 결과창 및 재촬영 버튼 */
        .result-box { margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 10px; font-size: 26px; font-weight: bold; color: #2e7d32; display: none; border: 2px solid #81c784; }
        .reset-btn { background: #1e88e5; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        
        .status { color: #444; font-size: 13px; margin-bottom: 15px; padding: 15px; background: #eaeaea; border-radius: 8px; word-break: break-all; text-align: left; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>실탄 자동 스냅샷 카운터</h2>
    
    <button id="startBtn" class="start-btn">⚡ 화면 터치하여 카운터 켜기</button>

    <div id="status" class="status">초록색 버튼을 터치하여 장치를 시작해 주세요.</div>
    
    <!-- 2초 타이머 카운트다운 표시기 -->
    <div id="timerBadge" class="timer-badge">포커스 고정 중... 2초</div>
    
    <video id="video" autoplay playsinline muted loop></video>
    <canvas id="canvasOutput"></canvas>
    
    <!-- 최종 분석 완료 결과창 -->
    <div id="resultBox" class="result-box">
        🎉 분석 완료: <span id="count">0</span>발 검출<br>
        <button class="reset-btn" onclick="resetCapture()">🔄 다시 촬영하기</button>
    </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const statusDiv = document.getElementById('status');
const timerBadge = document.getElementById('timerBadge');
const video = document.getElementById('video');
const canvasOutput = document.getElementById('canvasOutput');
const resultBox = document.getElementById('resultBox');
const ctx = canvasOutput.getContext('2d', { willReadFrequently: true });

let isOpenCvReady = false;
let isVideoTrackReady = false;
let isCaptured = false; // 자동 촬영 완료 여부 플래그

// 자동 스냅샷 추적 변수들
let lastBulletCount = -1;
let stableStartTime = 0;
const STABLE_DURATION = 2000; // 포커스 고정 대기 시간 (2초)

function printLog(msg, bgColor = '#e3f2fd', textColor = '#0d47a1') {
    statusDiv.style.background = bgColor;
    statusDiv.style.color = textColor;
    statusDiv.innerText = msg;
}

const eventType = ('ontouchstart' in window) ? 'touchstart' : 'click';

startBtn.addEventListener(eventType, function(e) {
    e.preventDefault();
    startBtn.style.display = 'none'; 
    printLog("🚀 [1단계] 모바일 터치 확인! 후면 카메라 연동을 시작합니다.");
    openDeviceHardware();
}, { passive: false });

function openDeviceHardware() {
    // 모바일 렌즈에 포커스 자동 맞춤 힌트 및 해상도 최적화 지정
    const mediaConstraints = {
        video: { 
            facingMode: { ideal: "environment" }, 
            width: { ideal: 640 },
            height: { ideal: 480 },
            // 모바일 크롬/사파리에 자동 초점 모드 힌트 제공
            focusMode: { ideal: "continuous" } 
        },
        audio: false
    };

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        printLog("❌ 에러: HTTPS 환경 혹은 네이티브 브라우저 앱(크롬/사파리)에서 실행해야 합니다.", '#ffebee', '#c62828');
        return;
    }

    navigator.mediaDevices.getUserMedia(mediaConstraints)
        .then(function(stream) {
            video.srcObject = stream;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.setAttribute('muted', 'true');
            
            video.play().then(() => {
                video.addEventListener('loadedmetadata', function() {
                    isVideoTrackReady = true;
                    printLog("🚀 [2단계] 카메라 연동 성공! 컴퓨터 비전 엔진을 불러옵니다.", '#e8f5e9', '#2e7d32');
                    injectOpenCvCore();
                });
            }).catch(playErr => {
                printLog("❌ 재생 정책 에러: " + playErr.message, '#ffebee', '#c62828');
            });
        })
        .catch(function(hardwareErr) {
            printLog("❌ 카메라 개방 거부됨: 스마트폰 개인정보 보호 설정에서 카메라를 허용해 주세요.", '#ffebee', '#c62828');
        });
}

function injectOpenCvCore() {
    const cdnScript = document.createElement('script');
    cdnScript.type = 'text/javascript';
    cdnScript.async = true;
    cdnScript.src = 'https://opencv.org';
    
    cdnScript.onload = function() {
        printLog("🚀 [3단계] AI 분석 분석 엔진 정밀 구동 중...", '#e8f5e9', '#2e7d32');
        loopCheckCvReady();
    };
    document.head.appendChild(cdnScript);
}

function loopCheckCvReady() {
    if (typeof cv !== 'undefined' && cv.matFromArray) {
        printLog("📸 [자동 촬영 스탠바이] 실탄 상자를 정면으로 대고 흔들림을 멈춰주세요.");
        isOpenCvReady = true;
        
        canvasOutput.style.display = 'block';
        canvasOutput.width = video.videoWidth || 640;
        canvasOutput.height = video.videoHeight || 480;
        
        requestAnimationFrame(cvVisionProcessingLoop);
    } else {
        setTimeout(loopCheckCvReady, 300);
    }
}

function cvVisionProcessingLoop() {
    // 💡 이미 캡처가 완료되었거나 장치가 준비 안 됐으면 루프 중단
    if (!isOpenCvReady || isCaptured || video.paused || video.ended) {
        return;
    }

    try {
        let vWidth = video.videoWidth || 640;
        let vHeight = video.videoHeight || 480;
        
        if(canvasOutput.width !== vWidth || canvasOutput.height !== vHeight) {
            canvasOutput.width = vWidth;
            canvasOutput.height = vHeight;
        }

        let src = new cv.Mat(vHeight, vWidth, cv.CV_8UC4);
        ctx.drawImage(video, 0, 0, vWidth, vHeight);
        let imgData = ctx.getImageData(0, 0, vWidth, vHeight);
        src.data.set(imgData.data);

        let gray = new cv.Mat();
        let circles = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(7, 7), 1.5, 1.5);

        // 허프서클 탐지 규격 (.22LR 실탄 구조 타겟 세팅)
        cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 22, 45, 16, 10, 28);

        let currentCount = 0;
        if (circles.cols > 0) {
            currentCount = circles.cols;
            for (let i = 0; i < circles.cols; ++i) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];
                let center = new cv.Point(x, y);
                cv.circle(src, center, radius,, 2);
                cv.circle(src, center, 2,, -1);
            }
        }

        cv.imshow('canvasOutput', src);

        // 💡 [2초 자동 촬영 알고리즘 코어]
        // 0발이 아니고, 이전 프레임에서 발견한 실탄 개수와 오차 없이 똑같다면 (포커스가 정지했다면)
        if (currentCount > 0 && currentCount === lastBulletCount) {
            let currentTime = Date.now();
            let elapsed = currentTime - stableStartTime;
            
            // 타이머 배지 활성화 및 카운트다운 텍스트 표시
            timerBadge.style.display = 'inline-block';
            let remainingSeconds = ((STABLE_DURATION - elapsed) / 1000).toFixed(1);
            timerBadge.innerText = `📸 포커스 고정됨... ${remainingSeconds > 0 ? remainingSeconds : 0}초 후 촬영`;

            // 2초 연속으로 개수 변동 없이 유지되었을 때 촬영 확정
            if (elapsed >= STABLE_DURATION) {
                triggerSnapshot(currentCount);
                src.delete(); gray.delete(); circles.delete();
                return; // 루프 즉시 종료
            }
        } else {
            // 개수가 요동치거나 흔들리면 타이머를 처음부터 다시 초기화
            if (currentCount > 0) {
                lastBulletCount = currentCount;
                stableStartTime = Date.now();
                timerBadge.style.display = 'none';
            } else {
                lastBulletCount = -1;
                timerBadge.style.display = 'none';
            }
        }

        src.delete();
        gray.delete();
        circles.delete();

    } catch (err) {
        console.error(err);
    }

    // 촬영 전까지 실시간 루프 무한 반복
    requestAnimationFrame(cvVisionProcessingLoop);
}

// 셔터 작동 및 화면 프리징(최종 개수 락) 함수
function triggerSnapshot(finalCount) {
    isCaptured = true;
    timerBadge.style.display = 'none';
    
    // 모바일 진동 효과 피드백제공 (지원 기기 한정)
    if (navigator.vibrate) navigator.vibrate(100);
    
    printLog("✅ 촬영 완료! 최종 탄약 수량을 파악했습니다.", '#e8f5e9', '#2e7d32');
    
    // 최종 결과 화면 개방
    document.getElementById('count').innerText = finalCount;
    resultBox.style.display = 'block';
}

// [재촬영] 버튼을 누르면 락을 풀고 다시 카메라 스트림 루프를 가동합니다
function resetCapture() {
    isCaptured = false;
    lastBulletCount = -1;
    resultBox.style.display = 'none';
    printLog("📸 [자동 촬영 스탠바이] 실탄 상자를 정면으로 대고 흔들림을 멈춰주세요.");
    requestAnimationFrame(cvVisionProcessingLoop);
}
</script>

</body>
</html>
