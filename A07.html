<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나주 사격장 실탄 카운터 (A07)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 15px; -webkit-user-select: none; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h2 { margin: 5px 0 15px 0; color: #1a1a1a; font-size: 20px; }
        
        .start-btn { 
            background: #00e676; color: #000; border: none; padding: 20px 30px; 
            font-size: 22px; font-weight: bold; border-radius: 35px; cursor: pointer; 
            width: 100%; box-shadow: 0 6px 20px rgba(0,230,118,0.4); margin-bottom: 15px; 
            -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
            display: block;
        }
        
        .video-box { position: relative; width: 100%; height: auto; background: #222; border-radius: 12px; overflow: hidden; min-height: 240px; }
        #video { width: 100%; height: auto; display: block; }
        #canvasOutput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
        
        .timer-badge { display: inline-block; padding: 6px 12px; background: #ff9100; color: white; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: none; }
        .result-box { margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 10px; font-size: 26px; font-weight: bold; color: #2e7d32; display: block; border: 2px solid #81c784; }
        .reset-btn { background: #1e88e5; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; display: none; }
        .status { color: #444; font-size: 13px; margin-bottom: 15px; padding: 15px; background: #eaeaea; border-radius: 8px; word-break: break-all; text-align: left; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 나주 사격장 실탄 카운터</h2>
    
    <button id="startBtn" class="start-btn">⚡ 스마트폰 카메라 켜기</button>
    <div id="status" class="status">초록색 버튼을 터치하여 장치를 시작해 주세요.</div>
    <div id="timerBadge" class="timer-badge">포커스 고정 중... 2초</div>
    
    <div class="video-box">
        <video id="video" autoplay playsinline muted loop></video>
        <canvas id="canvasOutput"></canvas>
    </div>
    
    <div id="resultBox" class="result-box">
        검출된 실탄: <span id="count">0</span>발
        <button id="resetBtn" class="reset-btn" onclick="resetCapture()">🔄 다시 촬영하기</button>
    </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const statusDiv = document.getElementById('status');
const timerBadge = document.getElementById('timerBadge');
const video = document.getElementById('video');
const canvasOutput = document.getElementById('canvasOutput');
const resetBtn = document.getElementById('resetBtn');
const ctx = canvasOutput.getContext('2d', { willReadFrequently: true });

let isOpenCvReady = false;
let isCaptured = false;
let lastBulletCount = -1;
let stableStartTime = 0;
const STABLE_DURATION = 2000; // 2초 정지 대기

// 모바일 환경에 따른 터치 이벤트 바인딩
const eventType = ('ontouchstart' in window) ? 'touchstart' : 'click';

startBtn.addEventListener(eventType, function(e) {
    e.preventDefault();
    startBtn.style.display = 'none'; 
    printLog("🚀 [1단계] 갤럭시 S26 울트라 터치 확인! 후면 카메라 연동을 개시합니다...");
    openDeviceHardware();
}, { passive: false });

function printLog(msg, bgColor = '#e3f2fd', textColor = '#0d47a1') {
    statusDiv.style.background = bgColor;
    statusDiv.style.color = textColor;
    statusDiv.innerText = msg;
}

function openDeviceHardware() {
    // 💡 최신 울트라 기기의 고해상도 폭주와 멀티 렌즈 꼬임을 예방하기 위해 해상도를 엄격히 규격화합니다.
    const mediaConstraints = {
        video: { 
            facingMode: { ideal: "environment" }, 
            width: { exact: 640 },
            height: { exact: 480 }
        },
        audio: false
    };

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        printLog("❌ 에러: HTTPS 환경 혹은 모바일 크롬 앱 주소창에 직접 입력하여 접속하셔야 권한 락이 풀립니다.", '#ffebee', '#c62828');
        return;
    }

    navigator.mediaDevices.getUserMedia(mediaConstraints)
        .then(function(stream) {
            video.srcObject = stream;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.setAttribute('muted', 'true');
            
            video.play().then(() => {
                printLog("🚀 [2단계] 후면 카메라 영상 출력 성공! 실시간 비전 AI 엔진을 주입합니다...", '#e8f5e9', '#2e7d32');
                injectOpenCvCore();
            }).catch(playErr => {
                printLog("❌ 재생 차단 정책 에러: " + playErr.message, '#ffebee', '#c62828');
            });
        })
        .catch(function(hardwareErr) {
            // exact 해상도가 맞지 않는 환경일 경우 안전 다운그레이드 모드로 즉시 우회 구조 가동
            printLog("🔄 초정밀 렌즈 세부 세팅 리매칭 중... (안전 모드 전환)");
            const fallbackConstraints = {
                video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            };
            navigator.mediaDevices.getUserMedia(fallbackConstraints).then(function(fallbackStream) {
                video.srcObject = fallbackStream;
                video.play().then(() => {
                    printLog("🚀 [2단계] 안전 규격으로 카메라 연동 성공! 비전 AI 엔진을 주입합니다...", '#e8f5e9', '#2e7d32');
                    injectOpenCvCore();
                });
            }).catch(finalErr => {
                printLog("❌ 카메라 하드웨어 연동 실패: 스마트폰 설정 ➔ 애플리케이션 ➔ Chrome ➔ 권한 메뉴에서 '카메라' 사용이 허용되어 있는지 꼭 확인하세요.", '#ffebee', '#c62828');
            });
        });
}

function injectOpenCvCore() {
    const cdnScript = document.createElement('script');
    cdnScript.type = 'text/javascript';
    cdnScript.async = true;
    cdnScript.src = 'https://opencv.org';
    
    cdnScript.onload = function() {
        printLog("📸 [자동 측정 스탠바이] 실탄 상자를 비추고 2초간 흔들림을 멈춰주세요.", '#e8f5e9', '#2e7d32');
        isOpenCvReady = true;
        requestAnimationFrame(cvVisionProcessingLoop);
    };
    document.head.appendChild(cdnScript);
}

function cvVisionProcessingLoop() {
    if (!isOpenCvReady || isCaptured || video.paused || video.ended) {
        return;
    }

    try {
        let vWidth = video.videoWidth || 640;
        let vHeight = video.videoHeight || 480;
        
        if(canvasOutput.width !== vWidth || canvasOutput.height !== vHeight) {
            canvasOutput.width = vWidth;
            canvasOutput.height = vHeight;
        }

        ctx.clearRect(0, 0, vWidth, vHeight);
        
        let src = new cv.Mat(vHeight, vWidth, cv.CV_8UC4);
        ctx.drawImage(video, 0, 0, vWidth, vHeight);
        let imgData = ctx.getImageData(0, 0, vWidth, vHeight);
        src.data.set(imgData.data);

        let gray = new cv.Mat();
        let circles = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(7, 7), 1.5, 1.5);

        // .22LR 실탄 가이드 트레이 서클 파라미터 세팅
        cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, 22, 45, 16, 10, 28);

        ctx.clearRect(0, 0, vWidth, vHeight);
        let currentCount = 0;
        if (circles.cols > 0) {
            currentCount = circles.cols;
            for (let i = 0; i < circles.cols; ++i) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];
                
                // 형광 연두색 동그라미 테두리 가이드라인
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00e676';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // 중심점 타겟팅 점
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff1744';
                ctx.fill();
            }
        }

        document.getElementById('count').innerText = currentCount;

        // 💡 포커스 정지 감지 및 2초 카운트다운 타이머 실행 알고리즘
        if (currentCount > 0 && currentCount === lastBulletCount) {
            let currentTime = Date.now();
            let elapsed = currentTime - stableStartTime;
            
            timerBadge.style.display = 'inline-block';
            let remaining = ((STABLE_DURATION - elapsed) / 1000).toFixed(1);
            timerBadge.innerText = `📸 초점 고정됨... ${remaining > 0 ? remaining : 0}초 후 캡처`;

            if (elapsed >= STABLE_DURATION) {
                triggerSnapshot(currentCount);
                src.delete(); gray.delete(); circles.delete();
                return;
            }
        } else {
            if (currentCount > 0) {
                lastBulletCount = currentCount;
                stableStartTime = Date.now();
                timerBadge.style.display = 'none';
            } else {
                lastBulletCount = -1;
                timerBadge.style.display = 'none';
            }
        }

        src.delete();
        gray.delete();
        circles.delete();

    } catch (err) {
        console.error(err);
    }

    requestAnimationFrame(cvVisionProcessingLoop);
}

function triggerSnapshot(finalCount) {
    isCaptured = true;
    timerBadge.style.display = 'none';
    video.pause(); // 화면 정지 잠금
    
    if (navigator.vibrate) navigator.vibrate(100); // 촬영 성공 진동 피드백
    
    printLog("🎉 측정 완료! 실탄 개수 데이터가 고정되었습니다.", '#e8f5e9', '#2e7d32');
    document.getElementById('count').innerText = finalCount;
    resetBtn.style.display = 'block'; // 재촬영 활성화
}
