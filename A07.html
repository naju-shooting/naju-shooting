<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>나주 사격장 실탄 카운터 A07</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f4f6f9}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#1a1a1a;padding:12px;box-sizing:border-box}
*{box-sizing:border-box}
.container{width:100%;max-width:600px;margin:0 auto;background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.10)}
h2{margin:4px 0 14px;font-size:20px}
.start-btn,.capture-btn,.reset-btn{width:100%;border:0;border-radius:32px;padding:17px 18px;font-size:19px;font-weight:800;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.start-btn{background:#00e676;color:#000}
.capture-btn{background:#ff1744;color:#fff;margin-top:14px}
.reset-btn{background:#1e88e5;color:#fff;margin-top:12px;display:none}
.status{margin:12px 0;padding:13px;border-radius:9px;background:#e3f2fd;color:#0d47a1;text-align:left;font-size:13px;font-weight:700;line-height:1.5;white-space:pre-line;word-break:break-word}
.video-box{position:relative;width:100%;min-height:240px;background:#111;border-radius:12px;overflow:hidden}
#video{display:block;width:100%;height:auto;background:#000}
#canvasOutput{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.result{display:none;margin-top:14px;padding:18px;background:#e8f5e9;border:2px solid #81c784;border-radius:12px;color:#2e7d32;font-size:28px;font-weight:800}
.note{font-size:12px;color:#666;line-height:1.5;margin-top:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
<h2>🎯 나주 사격장 실탄 카운터</h2>

<button id="startBtn" class="start-btn" type="button">⚡ 스마트폰 카메라 가동</button>

<div id="status" class="status">화면이 정상적으로 열렸습니다.
초록색 버튼을 눌러 카메라를 시작하세요.</div>

<div class="video-box">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvasOutput"></canvas>
</div>

<button id="captureBtn" class="capture-btn" type="button">📸 실탄 개수 촬영하기</button>
<button id="resetBtn" class="reset-btn" type="button">🔄 다시 촬영하기</button>

<div id="resultBox" class="result">
검출 결과: <span id="count">0</span>발
</div>

<div class="note">
카메라는 HTTPS 또는 localhost에서만 브라우저 보안정책상 사용할 수 있습니다.
네이버/카카오톡 내부 브라우저가 아니라 휴대폰 Chrome에서 직접 접속하세요.
</div>
</div>

<script>
"use strict";

let cameraStream = null;
let frozen = false;

const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const resetBtn = document.getElementById("resetBtn");
const statusBox = document.getElementById("status");
const video = document.getElementById("video");
const canvas = document.getElementById("canvasOutput");
const resultBox = document.getElementById("resultBox");
const countBox = document.getElementById("count");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

function status(text, ok){
  statusBox.textContent = text;
  statusBox.style.background = ok ? "#e8f5e9" : "#e3f2fd";
  statusBox.style.color = ok ? "#2e7d32" : "#0d47a1";
}

async function startCamera(){
  try{
    if(!window.isSecureContext){
      throw new Error("보안 연결이 아닙니다. 주소가 https:// 또는 localhost인지 확인하세요.");
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("현재 브라우저가 카메라 API를 지원하지 않습니다.");
    }

    status("🚀 카메라 권한을 요청하고 있습니다...\n팝업이 나오면 '허용'을 눌러주세요.",false);

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    video.srcObject = cameraStream;
    video.muted = true;
    video.setAttribute("playsinline","");
    await video.play();

    startBtn.classList.add("hidden");
    status("🎯 카메라 연결 완료\n탄약상자를 화면 안에 넣고 아래 촬영 버튼을 누르세요.",true);
    requestAnimationFrame(drawGuide);

  }catch(e){
    console.error(e);
    status("❌ 카메라 실행 실패\n"+e.message+
      "\n\n① Chrome 카메라 권한 허용\n② HTTPS 접속\n③ 네이버/카카오톡 내부 브라우저가 아닌 Chrome 직접 실행",false);
  }
}

function drawGuide(){
  if(frozen || video.paused || video.ended) return;

  const w=video.videoWidth || 640;
  const h=video.videoHeight || 480;

  if(canvas.width!==w || canvas.height!==h){
    canvas.width=w;
    canvas.height=h;
  }

  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(0,230,118,.85)";
  ctx.lineWidth=Math.max(3,w/320);
  ctx.strokeRect(w*.15,h*.15,w*.70,h*.70);

  requestAnimationFrame(drawGuide);
}

function capture(){
  if(!cameraStream || !video.videoWidth){
    alert("먼저 카메라를 켜주세요.");
    return;
  }

  frozen=true;
  video.pause();
  captureBtn.classList.add("hidden");

  const w=video.videoWidth;
  const h=video.videoHeight;
  canvas.width=w;
  canvas.height=h;

  ctx.drawImage(video,0,0,w,h);

  // 현재 버전은 기존 코드의 구리색 픽셀 군집 방식과 호환되는
  // 간단한 후보 검출을 사용한다.
  const img=ctx.getImageData(0,0,w,h);
  const data=img.data;

  const x0=Math.floor(w*.15), y0=Math.floor(h*.15);
  const x1=Math.floor(w*.85), y1=Math.floor(h*.85);

  const mask=new Uint8Array(w*h);

  for(let y=y0;y<y1;y+=2){
    for(let x=x0;x<x1;x+=2){
      const i=(y*w+x)*4;
      const r=data[i], g=data[i+1], b=data[i+2];

      if(r>110 && g>65 && b<125 && r>g*1.06 && g>b*1.08){
        mask[y*w+x]=1;
      }
    }
  }

  // 주변 후보를 중심점으로 모으는 간단한 grid clustering
  const gridSize=Math.max(12,Math.floor(Math.min(w,h)*.035));
  const cells=new Map();

  for(let y=y0;y<y1;y+=2){
    for(let x=x0;x<x1;x+=2){
      if(!mask[y*w+x]) continue;
      const gx=Math.floor(x/gridSize);
      const gy=Math.floor(y/gridSize);
      const key=gx+","+gy;

      if(!cells.has(key)) cells.set(key,{x:0,y:0,n:0});
      const c=cells.get(key);
      c.x+=x;c.y+=y;c.n++;
    }
  }

  const points=[];
  for(const c of cells.values()){
    if(c.n>=2) points.push({x:c.x/c.n,y:c.y/c.n});
  }

  // 너무 가까운 중심점 병합
  const merged=[];
  const minDistance=Math.max(16,Math.min(w,h)*.035);

  for(const p of points){
    let found=null;
    for(const q of merged){
      if(Math.hypot(p.x-q.x,p.y-q.y)<minDistance){
        found=q;break;
      }
    }
    if(found){
      found.x=(found.x+p.x)/2;
      found.y=(found.y+p.y)/2;
    }else{
      merged.push({x:p.x,y:p.y});
    }
  }

  // 결과 표시
  ctx.drawImage(video,0,0,w,h);
  ctx.strokeStyle="rgba(0,230,118,.85)";
  ctx.lineWidth=3;
  ctx.strokeRect(x0,y0,x1-x0,y1-y0);

  merged.forEach((p,i)=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,Math.max(12,Math.min(w,h)*.018),0,Math.PI*2);
    ctx.strokeStyle="#00e676";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.fillStyle="#ff1744";
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#00e676";
    ctx.font="bold "+Math.max(14,w/45)+"px sans-serif";
    ctx.fillText(String(i+1),p.x+8,p.y-8);
  });

  countBox.textContent=merged.length;
  resultBox.style.display="block";
  resetBtn.style.display="block";

  status("🎉 촬영 분석 완료\n검출 후보: "+merged.length+"발\n초록색 원이 실제 탄약 위치와 일치하는지 확인하세요.",true);
}

function resetCamera(){
  frozen=false;
  resultBox.style.display="none";
  resetBtn.style.display="none";
  captureBtn.classList.remove("hidden");

  if(cameraStream){
    video.play().then(()=>{
      status("🎯 다시 촬영할 준비가 되었습니다.",true);
      requestAnimationFrame(drawGuide);
    });
  }
}

startBtn.addEventListener("click",startCamera);
captureBtn.addEventListener("click",capture);
resetBtn.addEventListener("click",resetCamera);

window.addEventListener("pagehide",()=>{
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=null;
  }
});
</script>
</body>
</html>
