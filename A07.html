<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탄약 개수 실시간 파악 테스트</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px #0000001a; }
        video { display: none; } /* 카메라 원본은 숨기고 처리된 화면만 보여줍니다 */
        canvas { width: 100%; max-width: 500px; border-radius: 8px; background: #000; }
        .result-box { margin-top: 15px; font-size: 24px; font-weight: bold; color: #d32f2f; }
        .status { color: #666; font-size: 14px; margin-bottom: 10px; }
    </style>
    <!-- OpenCV.js 라이브러리 로드 -->
    <script async src="https://opencv.org" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>실탄 개수 실시간 카운터</h2>
    <div id="status" class="status">OpenCV 라이브러리를 로딩 중입니다...</div>
    
    <!-- 카메라 스트리밍용 비디오 (숨김) -->
    <video id="video" autoplay playsinline></video>
    
    <!-- 실시간 원 감지 결과가 그려질 화면 -->
    <canvas id="canvasOutput"></canvas>
    
    <div class="result-box">
        검출된 실탄: <span id="count">0</span>발
    </div>
</div>

<script>
let video = document.getElementById('video');
let canvasOutput = document.getElementById('canvasOutput');
let ctx = canvasOutput.getContext('2d');
let streamPtr = null;
let isOpenCvReady = false;

// 1. OpenCV.js 로드 완료 시 실행
function onOpenCvReady() {
    document.getElementById('status').innerText = "OpenCV 로드 완료! 카메라를 연결합니다.";
    isOpenCvReady = true;
    startCamera();
}

// 2. 모바일/PC 카메라 연동 (이전 단계 가이드 반영)
function startCamera() {
    const constraints = {
        video: { facingMode: { ideal: "environment" } }, // 후면 카메라 우선
        audio: false
    };

    navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            video.srcObject = stream;
            video.play();
            document.getElementById('status').innerText = "카메라 작동 중 - 탄약상자를 비춰주세요.";
            // 영상 재생이 시작되면 분석 루프 실행
            video.addEventListener('canplay', () => {
                // 캔버스 크기를 비디오 해상도에 맞춤
                canvasOutput.width = video.videoWidth;
                canvasOutput.height = video.videoHeight;
                setTimeout(processVideo, 30);
            });
        })
        .catch(function(err) {
            document.getElementById('status').innerText = "카메라 연결 실패: " + err.name;
            console.error(err);
        });
}

// 3. 실시간 프레임 분석 루프
function processVideo() {
    if (!isOpenCvReady || video.paused || video.ended) {
        return;
    }

    try {
        // 현재 카메라 프레임을 OpenCV 행렬(Mat)로 가져옴
        let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
        ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
        let imgData = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);
        src.data.set(imgData.data);

        // 연산을 위한 임시 행렬 선언
        let gray = new cv.Mat();
        let circles = new cv.Mat();

        // 흑백(Grayscale) 변환 및 노이즈 제거(가우시안 블러)
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(9, 9), 2, 2);

        // 허프 변환을 통한 원(실탄 뒷면) 검출
        // (민감도 파라미터는 카메라 거리와 조명에 따라 튜닝이 필요할 수 있습니다)
        cv.HoughCircles(
            gray, 
            circles, 
            cv.HOUGH_GRADIENT, 
            1, 
            25,    // minDist: 원과 원 사이의 최소 거리 (픽셀 단위)
            50,    // param1: 캐니 에지 임계값
            18,    // param2: 원 검출 임계값 (낮을수록 더 민감하게 원을 찾음)
            8,     // minRadius: 최소 원 반지름
            25     // maxRadius: 최대 원 반지름
        );

        let count = 0;
        // 검출된 원들을 원본 이미지 위에 그리기
        if (circles.cols > 0) {
            count = circles.cols;
            for (let i = 0; i < circles.cols; ++i) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];
                
                // 외곽 원 그리기 (초록색)
                let center = new cv.Point(x, y);
                cv.circle(src, center, radius, [0, 255, 0, 255], 2);
                // 중심점 그리기 (빨간색)
                cv.circle(src, center, 2, [255, 0, 0, 255], -1);
            }
        }

        // 결과를 웹페이지에 업데이트
        document.getElementById('count').innerText = count;
        cv.imshow('canvasOutput', src);

        // 메모리 해제 (자바스크립트 OpenCV 필수 작업)
        src.delete();
        gray.delete();
        circles.delete();

    } catch (err) {
        console.error(err);
    }

    // 다음 프레임 예약 (실시간 반복)
    requestAnimationFrame(processVideo);
}
</script>

</body>
</html>
