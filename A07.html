<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나주 사격장 실탄 카운터 (A07)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 166px rgba(0,0,0,0.08); }
        h2 { margin: 5px 0 15px 0; color: #1a1a1a; font-size: 20px; }
        
        /* ⚡ 시스템 가동 버튼 (가장 원초적이고 충돌 없는 순수 HTML 스타일) */
        .start-btn { 
            background: #00e676; color: #000; border: none; padding: 18px 25px; 
            font-size: 20px; font-weight: bold; border-radius: 35px; cursor: pointer; 
            width: 100%; box-shadow: 0 6px 20px rgba(0,230,118,0.4); margin-bottom: 15px; 
        }
        
        /* 📸 [구조 변경] 처음부터 화면에 무조건 노출되도록 고정된 촬영 버튼 */
        .capture-btn {
            background: #ff1744; color: white; border: none; padding: 18px 25px;
            font-size: 20px; font-weight: bold; border-radius: 35px; cursor: pointer;
            width: 100%; box-shadow: 0 6px 20px rgba(255,23,68,0.4); margin-top: 15px;
            margin-bottom: 15px;
        }
        
        /* 🔄 다시 촬영하기 버튼 */
        .reset-btn { 
            background: #1e88e5; color: white; border: none; padding: 15px 25px; 
            font-size: 18px; font-weight: bold; border-radius: 35px; cursor: pointer; 
            margin-top: 15px; width: 100%; box-shadow: 0 6px 20px rgba(30,136,229,0.4);
            display: none;
        }
        
        .video-box { position: relative; width: 100%; height: auto; background: #222; border-radius: 12px; overflow: hidden; min-height: 240px; }
        #video { width: 100%; height: auto; display: block; background: #000; }
        #canvasOutput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
        
        .result-box { margin-top: 15px; padding: 20px; background: #e8f5e9; border-radius: 12px; font-size: 28px; font-weight: bold; color: #2e7d32; display: none; border: 2px solid #81c784; }
        .status { color: #444; font-size: 13px; margin-bottom: 15px; padding: 15px; background: #eaeaea; border-radius: 8px; word-break: break-all; text-align: left; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 나주 사격장 실탄 카운터</h2>
    
    <!-- 1번 문제 해결: 충돌 유발 요소를 제거한 순수 원터치 가동 버튼 -->
    <button id="startBtn" class="start-btn" onclick="activateDeviceLens()">⚡ 스마트폰 카메라 가동</button>
    <div id="status" class="status">네이버 앱으로 접속하셨다면 위의 초록색 버튼을 눌러 카메라를 먼저 켜주세요.</div>
    
    <div class="video-box">
        <video id="video" autoplay playsinline muted loop></video>
        <canvas id="canvasOutput"></canvas>
    </div>
    
    <!-- 2번 문제 해결: 처음부터 화면에 무조건 대기하고 있는 촬영하기 버튼 -->
    <button id="captureBtn" class="capture-btn" onclick="processAndCountBullets()">📸 실탄 개수 촬영하기</button>
    
    <!-- 다시 촬영 버튼 -->
    <button id="resetBtn" class="reset-btn" onclick="unfreezeAndResetCamera()">🔄 다시 촬영하기</button>
    
    <!-- 결과 표기 박스 -->
    <div id="resultBox" class="result-box">
        검출 결과: <span id="count">0</span>발
    </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const resetBtn = document.getElementById('resetBtn');
const statusDiv = document.getElementById('status');
const video = document.getElementById('video');
const canvasOutput = document.getElementById('canvasOutput');
const resultBox = document.getElementById('resultBox');
const ctx = canvasOutput.getContext('2d', { willReadFrequently: true });

let isFreezeSnapshot = false;

function printLog(msg, bgColor = '#e3f2fd', textColor = '#0d47a1') {
    statusDiv.style.background = bgColor;
    statusDiv.style.color = textColor;
    statusDiv.innerText = msg;
}

// 💡 충돌 요소를 모두 걷어내고 네이버 웹뷰 규격에 맞춘 다이렉트 하드웨어 구동 함수
function activateDeviceLens() {
    printLog("🚀 카메라 하드웨어 신호를 연결 중입니다. 팝업창이 뜨면 '허용'을 눌러주세요...");
    
    const mediaConstraints = {
        video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
    };

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        printLog("❌ 에러: 주소창 앞이 https:// 가 맞는지, 혹은 카카오톡 창이 아닌 일반 네이버/사파리 앱이 맞는지 확인하세요.", '#ffebee', '#c62828');
        return;
    }

    navigator.mediaDevices.getUserMedia(mediaConstraints)
        .then(function(stream) {
            video.srcObject = stream;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.setAttribute('muted', 'true');
            
            video.play().then(() => {
                startBtn.style.display = 'none'; // 카메라가 정상적으로 켜지면 가동 버튼 숨김
                printLog("🎯 [실시간 조준 중] 실탄의 동그란 구리색 면이 정면으로 보이게 조준 가이드에 맞춘 뒤 아래 [촬영하기] 버튼을 누르세요.", '#e8f5e9', '#2e7d32');
                requestAnimationFrame(liveRectGuideLoop);
            });
        })
        .catch(function(hardwareErr) {
            printLog("❌ 하드웨어 거부: 스마트폰 자체 권한 설정에서 네이버 앱의 카메라 허용 상태를 확인해 주세요.", '#ffebee', '#c62828');
        });
}

// 조준선 사각형 가이드라인 출력 루프
function liveRectGuideLoop() {
    if (isFreezeSnapshot || video.paused || video.ended) return;

    let vWidth = video.videoWidth || 640;
    let vHeight = video.videoHeight || 480;
    
    if(canvasOutput.width !== vWidth || canvasOutput.height !== vHeight) {
        canvasOutput.width = vWidth;
        canvasOutput.height = vHeight;
    }

    ctx.clearRect(0, 0, vWidth, vHeight);
    
    // 조준 정렬용 반투명 연두색 가이드라인 생성
    ctx.strokeStyle = 'rgba(0, 230, 118, 0.6)';
    ctx.lineWidth = 3;
    ctx.strokeRect(vWidth * 0.15, vHeight * 0.15, vWidth * 0.7, vHeight * 0.7);

    requestAnimationFrame(liveRectGuideLoop);
}

// 💡 캡처 시 작동하는 고속 동그란 구리색 실탄 판별 알고리즘 코어
function processAndCountBullets() {
    if (video.paused && !isFreezeSnapshot) {
        alert("카메라가 아직 켜지지 않았습니다. 초록색 버튼을 먼저 눌러주세요.");
        return;
    }
    
    isFreezeSnapshot = true;
    captureBtn.style.display = 'none'; // 촬영 버튼 숨김
    video.pause(); // 프레임 프리징

    if (navigator.vibrate) navigator.vibrate(60);

    printLog("⚙️ 사진 분석 진행 중... 구리색 탄피의 중심점을 정밀 계산하고 있습니다.");

    setTimeout(() => {
        try {
            let vWidth = video.videoWidth || 640;
            let vHeight = video.videoHeight || 480;

            ctx.drawImage(video, 0, 0, vWidth, vHeight);
            let frame = ctx.getImageData(0, 0, vWidth, vHeight);
            let data = frame.data;

            ctx.clearRect(0, 0, vWidth, vHeight);

            let copperPoints = [];
            let pixelStep = 4; 

            // 1단계: 동그란 실탄 후면의 순수 '구리색(황금색)' 픽셀 필터링
            for (let y = 0; y < vHeight; y += pixelStep) {
                for (let x = 0; x < vWidth; x += pixelStep) {
                    let idx = (y * vWidth + x) * 4;
                    let r = data[idx];
                    let g = data[idx + 1];
                    let b = data[idx + 2];

                    if (r > 130 && g > 90 && b < 80 && r > g && g > b) {
                        copperPoints.push({x: x, y: y});
                    }
                }
            }

            // 2단계: 군집화(Clustering) 기법으로 독립된 개별 실탄 좌표 도출
            let bulletClusters = [];
            let bulletMinDistance = 22; 

            for (let p of copperPoints) {
                let isAssigned = false;
                for (let c of bulletClusters) {
                    let dist = Math.hypot(p.x - c.x, p.y - c.y);
                    if (dist < bulletMinDistance) {
                        c.x = (c.x * c.count + p.x) / (c.count + 1);
                        c.y = (c.y * c.count + p.y) / (c.count + 1);
                        c.count++;
                        isAssigned = true;
                        break;
                    }
                }
                if (!isAssigned && bulletClusters.length < 65) {
                    bulletClusters.push({x: p.x, y: p.y, count: 1});
                }
            }

            let finalVerifiedBullets = bulletClusters.filter(c => c.count > 3);
            let totalCountResult = finalVerifiedBullets.length;

            // 3단계: 사진 위에 최종 파악된 실탄 마킹 오버레이 출력
            for (let b of finalVerifiedBullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 14, 0, 2 * Math.PI);
                ctx.strokeStyle = '#00e676'; // 연두색 동그라미 테두리
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff1744'; // 빨간 중심점
                ctx.fill();
            }

            printLog("🎉 분석이 완료되었습니다. 결과 발수를 확인하세요.", '#e8f5e9', '#2e7d32');
            document.getElementById('count').innerText = totalCountResult;
            
            resultBox.style.display = 'block';
            resetBtn.style.display = 'block'; // 다시 촬영 버튼 노출

        } catch (err) {
            printLog("❌ 분석 실패 오류: " + err.message, '#ffebee', '#c62828');
            unfreezeAndResetCamera();
        }
    }, 300); 
}

// 🔄 다시 촬영하기 처리 함수
function unfreezeAndResetCamera() {
    isFreezeSnapshot = false;
    resultBox.style.display = 'none';
    resetBtn.style.display = 'none';
    captureBtn.style.display = 'block'; // 촬영 버튼 원상복구
    
    video.play().then(() => {
        printLog("🎯 [실시간 조준 중] 실탄의 동그란 구리색 면이 정면으로 보이게 조준 가이드에 맞춘 뒤 아래 [촬영하기] 버튼을 누르세요.");
        requestAnimationFrame(liveRectGuideLoop);
    });
}
</script>

</body>
</html>
